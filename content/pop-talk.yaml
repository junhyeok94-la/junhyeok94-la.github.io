title: Pop Talk
subtitle: HyperCLOVA X 기반 영화 관람 기록·취향 분석 AI Agent
context: NIPA-NAVER Cloud Sovereign AI PBL 기반 프로젝트
period: 2026.08
team: 4인 팀
award: 우수상
role: 데이터·AI Agent 구현 참여
overview: 사용자의 취향뿐 아니라 누구와 보는지, 현재 기분과 시청 가능 시간 같은 상황까지 이해하고 추천 이유와 검증 근거를 함께 제공하는 Personal Movie AI Agent입니다.
problem:
  - 영화 선택에 시간이 오래 걸리지만 기존 추천은 현재 상황을 충분히 반영하지 못했습니다.
  - 생성형 AI 추천은 근거가 부족하고 환각 가능성이 있어 결과를 신뢰하기 어려웠습니다.
  - 영화 정보, 리뷰, 평점과 관람 기록이 여러 서비스에 분산되어 있었습니다.
values:
  - name: Personalization
    description: 사용자 취향과 현재 요청 조건을 함께 반영
  - name: Explainability
    description: 추천한 이유와 사용한 근거를 사용자에게 설명
  - name: Verification
    description: 영화 정보, 요청 조건과 리뷰 근거를 재검증
  - name: Trust
    description: 검수 결과와 안전한 폴백으로 응답 신뢰성 확보
contributions:
  - area: DATA PIPELINE
    title: 공공 영화 데이터를 검색 가능한 근거로
    description: KOBIS·KMDB 데이터를 스케줄 수집하고 정제·병합해 PostgreSQL에 적재하는 흐름을 구현했습니다.
  - area: RAG CONTEXT
    title: 메타데이터와 리뷰를 답변 근거로
    description: 영화와 리뷰 임베딩을 pgvector에 저장하고, 검색 결과와 근거 ID가 응답 생성까지 이어지도록 구성했습니다.
  - area: AGENT QUALITY
    title: 실패를 원인별로 되돌리는 검수 루프
    description: 의도 분류·QueryPlan·검색·생성·검수를 분리하고 실패 원인에 따라 필요한 단계부터 재실행하도록 설계했습니다.
productViews:
  - title: 탐색·상세·리뷰·취향 온보딩
    description: 영화 탐색과 상세 정보, 관람객 리뷰, 가입 시 선호 키워드 선택까지 개인화의 입력과 결과를 하나의 흐름으로 연결했습니다.
    image: /projects/pop-talk/product-user-experience.webp
    alt: Pop Talk의 영화 추천 홈, 영화 상세, 관람객 리뷰와 취향 온보딩 사용자 화면
  - title: 자연어 추천과 외부 리뷰 근거
    description: 상황을 담은 자연어 요청에 영화별 추천 이유를 제공하고, 관련 리뷰 콘텐츠까지 이어지는 응답 화면을 구현했습니다.
    image: /projects/pop-talk/product-agent-experience.webp
    alt: 자연어 조건을 반영한 Pop Talk 영화 추천 결과와 외부 리뷰 근거 화면
  - title: 데이터와 배치를 한눈에 보는 운영 대시보드
    description: 영화 인증 상태, 전체 영화·감상평 현황과 매일 실행되는 데이터 수집 배치의 처리 결과를 한 화면에서 확인합니다.
    image: /projects/pop-talk/product-admin-dashboard.webp
    alt: 영화 데이터와 배치 실행 현황을 보여주는 Pop Talk 관리자 대시보드
  - title: 영화 검수와 노출 상태 관리
    description: 수집된 영화의 정보 누락, 인증 상태와 사용자 노출 여부를 검색·필터링하고 상세 화면에서 검수할 수 있습니다.
    image: /projects/pop-talk/product-admin-operations.webp
    alt: 수집 영화의 인증과 노출 상태를 검수하는 Pop Talk 관리자 화면
demoSnapshot:
  - label: 영화 메타데이터
    value: 5,315편
  - label: 인증 완료 영화
    value: 5,309편
  - label: 누적 감상평
    value: 59,863건
dataFlow:
  - KOBIS 영화 목록·상세 수집
  - KMDB 포스터·등급·줄거리·키워드 결합
  - 데이터 정제·병합 후 PostgreSQL UPSERT
  - 영화·리뷰 임베딩을 pgvector에 저장
  - RAG 검색 결과를 HyperCLOVA X 응답 근거로 사용
agentFlow:
  - stage: 입력 및 라우팅
    detail: 입력 검증, CLOVA Router 기반 의도 분류, 구조화된 QueryPlan 생성
  - stage: 엔티티 식별 및 검색
    detail: 영화 고유 ID 확정 후 정보·평점·리뷰·추천·개봉 일정 등 의도별 데이터 조회
  - stage: 초안 생성
    detail: 검색 근거 ID를 포함한 컨텍스트로 답변을 생성하고 누락된 인용을 보완
  - stage: 품질 및 안전성 검수
    detail: 의도 일치, 사실 근거, 완전성, 스포일러 안전성과 명확성을 평가
  - stage: 자가교정
    detail: 실패 원인에 따라 의도 재분류, 쿼리 재분석, 재검색 또는 재생성을 수행
  - stage: 최종 응답
    detail: 검수 통과 답변을 확정하고 재시도 소진 시 근거 기반 안전 응답으로 전환
architecture:
  - layer: Service
    detail: Next.js 사용자·관리자 화면, FastAPI 기반 REST API
  - layer: AI & Agent
    detail: HyperCLOVA X, CLOVA Studio Router, LangGraph, RAG
  - layer: Data
    detail: KOBIS·KMDB 수집 배치, PostgreSQL 16, pgvector
  - layer: NCP Infrastructure
    detail: Public·Private Subnet, 이중 Load Balancer, Bastion, NAT Gateway, PrivateLink
stack:
  Front-End: [Next.js, React, TypeScript, Tailwind CSS]
  Back-End: [Python, FastAPI, SQLAlchemy]
  AI & Agent: [HyperCLOVA X, LangGraph, RAG, CLOVA Studio]
  Data: [PostgreSQL, pgvector, KOBIS API, KMDB API]
  Infra: [NAVER Cloud Platform, VPC, Load Balancer, Object Storage]
roadmap:
  - 티켓 OCR 고도화
  - 추천 검증 고도화
  - 동반자 취향 분석
  - 멀티플렉스·OTT 연계
  - 장기 취향 Profile
sourcesNote: 팀원 개인정보가 포함된 원본 문서는 게시하지 않고, 비식별화한 구현 화면과 프로젝트 설명·시스템 아키텍처만 선별해 제공합니다.
