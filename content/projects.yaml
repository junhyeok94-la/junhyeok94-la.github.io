- id: gs-retail-hbu
  title: GS리테일 HBU 데이터 플랫폼 전환
  category: Private Sector
  period: 2025.06 - 2026.03
  role: 배치 최적화 매니저
  company: 누리꿈소프트(주)
  featured: true
  summary: Oracle·SAS 기반 홈쇼핑 데이터를 Airflow, dbt, Redshift 기반 플랫폼으로 전환하고 배치 시간, 비용, 품질 거버넌스를 개선했습니다.
  stack:
    - Apache Airflow 2.10
    - dbt
    - Amazon Redshift
    - AWS ECS Fargate
    - Grafana
  achievements:
    - title: 워크로드 격리와 비용 최적화
      problem: 1,000개 이상의 dbt 모델이 특정 시간대에 Provisioned 클러스터의 쿼리 큐잉과 리소스 경합을 유발했습니다.
      action: manifest.json 의존성을 파싱하고 헤비 모델을 Redshift Serverless로 분리 실행하는 태그 기반 파이프라인을 설계했습니다.
      result: 상시 클러스터 증설 없이 피크 타임 병목을 제거하고 불필요한 비용을 방어했습니다.
    - title: Stateful Backfill 체계
      problem: Hourly 배치의 소급 범위가 4시간으로 하드코딩되어 장시간 장애 시 복구에 제약이 있었습니다.
      action: Airflow Variable로 마지막 성공 data_interval_end를 추적하는 상태 관리 로직을 도입했습니다.
      result: 안전 소급 범위를 24시간 이상으로 확장해 데이터 유실 위험을 낮췄습니다.
    - title: 대규모 오케스트레이션 표준화
      problem: 단일 DAG에서 대규모 모델을 파싱할 때 렌더링 지연과 워커 슬롯 낭비가 발생했습니다.
      action: 도메인별 Sub DAG와 Control DAG 구조로 분리하고 deferrable 실행을 템플릿화했습니다.
      result: 파싱 부하와 워커 점유를 줄이고 다수 수행사가 함께 사용할 수 있는 운영 표준을 만들었습니다.
    - title: 데이터 품질 가드레일
      problem: Redshift가 PK 유일성을 강제하지 않아 멀티 수행사 환경에서 중복 데이터 인입 위험이 있었습니다.
      action: 핵심 모델의 dbt test 의무화와 배치 후행 전수 중복 검증 DAG를 구축했습니다.
      result: 사람의 주의력에 의존하지 않는 이중 데이터 품질 검증 체계를 확립했습니다.
    - title: 메타 DB 부하 개선
      problem: Grafana의 비효율적인 메타 DB 쿼리가 Airflow 스케줄러 지연을 유발했습니다.
      action: 인덱스를 고려한 경량 쿼리로 대시보드를 재설계했습니다.
      result: 스케줄러 응답을 정상화하고 태스크·Pool Slot·지연율 모니터링을 안정화했습니다.
- id: pop-talk-ai-agent
  title: Pop Talk · Personal Movie AI Agent
  category: AI PBL · Awarded Project
  period: 2026.08
  role: 4인 팀 · 데이터·AI Agent 구현 참여
  company: NIPA-NAVER Cloud Sovereign AI PBL
  featured: true
  award: 우수상
  detailPath: /projects/pop-talk
  summary: 사용자의 취향과 현재 상황을 함께 이해하고, 실제 영화 데이터에 근거한 추천 이유와 검증 결과를 제공하는 멀티 챗봇 에이전트를 구현했습니다.
  stack:
    - HyperCLOVA X
    - LangGraph
    - RAG
    - FastAPI
    - PostgreSQL/pgvector
    - NAVER Cloud Platform
  achievements:
    - title: 근거 기반 자가교정 Agent Flow
      problem: 생성형 AI의 영화 추천은 출처가 불명확하거나 사용자 조건과 어긋나는 환각 위험이 있었습니다.
      action: 입력 검증, 의도 분류, QueryPlan 생성, 검색, 초안 생성, 품질 검수와 재시도를 LangGraph 상태 그래프로 구성했습니다.
      result: 추천 근거를 추적하고 검수 실패 시 재분류·재검색·재생성하는 안전한 응답 흐름을 구현했습니다.
    - title: 공공 영화 데이터 RAG 파이프라인
      problem: LLM 자체 지식만으로는 최신성, 평점, 리뷰와 같은 사실 기반 답변을 보장하기 어려웠습니다.
      action: KOBIS·KMDB 데이터를 수집·병합하고 PostgreSQL/pgvector에 메타데이터와 임베딩을 저장해 검색 근거로 활용했습니다.
      result: 실제 영화 데이터와 리뷰를 바탕으로 추천 이유를 설명하는 RAG 기반 서비스를 완성했습니다.
    - title: 팀 프로젝트 우수상
      problem: 교육에서 학습한 Sovereign AI, 생성형 AI, 데이터 파이프라인과 NCP 인프라를 하나의 실행 가능한 서비스로 통합해야 했습니다.
      action: 4인 팀으로 사용자·관리자 기능, 배치 수집, AI Agent, 데이터베이스와 보안 네트워크를 연결해 데모 가능한 시스템을 구현했습니다.
      result: 최종 프로젝트 평가에서 우수상을 수상했습니다.
