- id: gs-retail-hbu
  title: GS리테일 HBU 데이터 플랫폼 전환
  category: Private Sector
  period: 2025.06 - 2026.04
  role: 배치 최적화 · 오케스트레이션 표준화
  contribution:
    rate: 100%
    basis: 배치 최적화 담당 영역 전반 주도
  company: 누리꿈소프트(주)
  featured: true
  summary: Oracle·SAS 기반 홈쇼핑 데이터의 Airflow·dbt·Redshift 전환에서 1,000개 이상 dbt 모델의 배치 최적화와 복구·검증·모니터링을 담당
  stack:
    - Apache Airflow 2.10
    - dbt
    - Amazon Redshift
    - AWS ECS Fargate
    - Grafana
    - Bitbucket
    - Bamboo
    - Confluence
  achievements:
    - title: 고부하 모델의 실행 환경 분리
      problem: 특정 시간대 Provisioned 클러스터에 쿼리 대기와 자원 경합 발생. 전체 Serverless 전환에는 비용 부담.
      action: manifest.json의 의존성·태그를 분석해 선정한 고부하 모델만 Serverless로 분리. CTE 중간 결과를 CTAS로 물리화하고 Sort Key를 적용하도록 쿼리 구조 개선.
      result: 상시 클러스터 증설 없이 피크 시간대 자원 경합 완화.
    - title: 시간별 배치 누락 구간 자동 복구
      problem: 자동 소급 범위가 4시간으로 고정돼 장시간 장애 시 누락 구간 복구에 제약.
      action: 마지막 성공 구간의 종료 시각(data_interval_end)을 Airflow Variable에 저장. 다음 실행에서 업무일 경계·선행 완료·대기 조건을 확인해 처리 구간 계산.
      result: 자동 복구 대상 범위를 4시간에서 최대 24시간으로 확장. 일별 배치가 참조하는 해당 일자 00시 시간별 배치의 누락 구간 복구 지원.
    - title: 도메인별 배치 실행 표준화
      problem: 대규모 모델을 단일 DAG에서 파싱할 때 렌더링 지연과 워커 슬롯 점유 발생.
      action: BI 모델·주요 최종 테이블 기준으로 공통 사용 테이블을 묶고 고객사 운영팀과 도메인별 실행 DAG 확정. Control DAG, 태그 기반 TaskGroup 호출과 비동기 대기(deferrable) 등 공통 규칙 적용.
      result: DAG 파싱 부하·워커 점유 완화. 여러 수행사가 같은 기준으로 개발·운영할 수 있는 실행 규칙 정리.
    - title: 전환 전후 데이터 비교 검증
      problem: 중복 키 검증과 함께 AS-IS·TO-BE의 건수·주요 컬럼 값을 확인할 공통 기준 필요.
      action: dbt test와 후행 중복 검증에 더해 주요 컬럼을 그룹화한 건수·값을 비교하는 Diff Check DAG 개발. 비교 결과를 Redshift에 매일 적재.
      result: 수행사·고객사가 동일한 검증 결과를 확인하도록 구성. 수작업 검증과 반복 협의 감소.
    - title: Airflow 메타 DB 조회 부하 개선
      problem: Grafana의 Airflow 메타 DB 조회에서 슬로 쿼리가 발생해 스케줄러 지연으로 연결.
      action: 인덱스를 고려한 조회 쿼리 경량화. 도메인별 실행 추이·실패 태스크·Pool Slot·배치 지연율을 확인하도록 대시보드 수정.
      result: 스케줄러 응답 정상화와 배치 운영 지표 모니터링 안정화.
