  question: 원천 테이블 분석에 따른 전체·증분 적재 기준 수립
  overview: 전사 정형 데이터를 AWS 데이터 레이크로 이관하는 프로젝트. 원천 데이터를 분석해 운영 데이터 저장소(ODS)의 전체·증분 적재 방식을 결정하고 Airflow DAG 코드 생성·적용 담당.
