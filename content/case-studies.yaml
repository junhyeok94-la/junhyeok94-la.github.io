      image: /projects/local-finance/classification-workflow.svg
      alt: 기준과 지표를 설정하고 가중치 합계를 확인해 유형분류를 산출·저장한 뒤 연도별 확정 또는 전문기관 자료 비교로 이어지는 업무 흐름
      caption: 본인 작성 사용자지침서의 11개 화면을 업무 단위로 정리한 도식. 가중치 합계 100%, 확정 차수의 재산출 제한, 연도별 한 차수 확정과 전문기관 자료 비교 규칙 반영. 내부 화면·화면 ID·실제 데이터는 게시하지 않음.
