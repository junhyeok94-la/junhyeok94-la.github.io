- id: gs-retail-hbu
  type: platform
  label: 배치 최적화 · 플랫폼 전환
  question: Airflow·dbt 배치 실행 표준화와 누락 구간 복구
  overview: Oracle·SAS 기반 홈쇼핑 데이터를 AWS 데이터 플랫폼으로 전환. STG 수집·적재와 Mart·BI·IF 변환 배치를 구분해 운영하며, 배치 실행 제어·선택적 Serverless 실행·누락 구간 복구·비교 검증을 담당.
  scope:
    - 고객사 운영팀과 도메인별 실행 DAG 범위 합의, 태그·TaskGroup 공통 호출 규칙 정리
    - manifest.json의 의존성·태그를 분석하고, 선정한 고부하 모델의 run·test를 Serverless 태스크로 분리
    - Airflow Variable과 선행 배치 완료 구간을 기준으로 실행 범위를 계산하고, 최대 24시간 누락 구간 복구
    - 전환 전후 데이터를 비교하는 Diff Check DAG 개발 및 Grafana 조회 쿼리·운영 지표 개선
  architecture:
    title: STG 수집·적재와 Mart·BI·IF 변환
    description: 원천 데이터를 수집 도구·EMR로 추출해 S3에 1차 적재하고, dbt Bash 실행으로 Redshift STG 테이블 생성. 이후 Mart·BI·IF 모델은 Cosmos DbtTaskGroup으로 실행. Airflow가 실행 주기·선행 완료·처리 구간을 제어.
    image: /projects/gs-retail-hbu/platform-overview.svg
    alt: STG의 수집 API·EMR·S3·dbt Bash 적재와 Cosmos를 이용한 Mart·BI·IF 변환을 구분한 구성도
    caption: 운영 가이드를 바탕으로 재구성한 일반 RDBMS 수집·변환 경로. 로그·외부 API 등 별도 경로와 내부 시스템·테이블·접속 정보는 생략.
  figures:
    - title: 도메인별 배치 실행 제어
      image: /projects/gs-retail-hbu/orchestration.svg
      alt: Control DAG가 선행 완료와 처리 구간을 확인하고 실행 DAG와 dbt TaskGroup을 호출하는 흐름
      caption: Mart·BI·IF 실행 구조. Control DAG가 선행 완료를 확인하고 처리 구간을 하위 DAG에 전달. Cosmos는 태그로 모델을 선택하고 모델 의존성에 따라 실행.
    - title: 개발 검증 후 운영 브랜치 병합·배포
      image: /projects/gs-retail-hbu/delivery-flow.svg
      alt: dev 브랜치를 Bamboo로 개발 배포하고 검증한 다음 prd로 병합해 운영 배포하는 순차 흐름
      caption: dev 배포·검증 → dev를 prd에 병합 → 운영 배포. 환경별 dbt와 DAG 코드는 구분해 배포. 배포 단계에서는 dbt parse로 manifest를 생성하고, 실제 데이터 처리는 Airflow 스케줄 실행 시 수행.
    - title: 고부하 모델의 선택적 실행 환경 분리
      image: /projects/gs-retail-hbu/workload-isolation.svg
      alt: 선정한 dbt 모델만 Serverless run·test 태스크로 전환하고 선행·후행 의존성을 연결하는 흐름
      caption: DbtTaskGroup의 모델별 실행 대상 변경을 보완하는 공통 함수 적용. 선정 모델의 run·test 태스크를 별도로 구성하고 기존 선행·후행 의존성 복원. 전체 모델의 Serverless 전환은 아님.
    - title: 마지막 성공 구간을 기준으로 누락 범위 복구
      image: /projects/gs-retail-hbu/interval-recovery.svg
      alt: 마지막 성공 종료 구간과 선행 완료 구간으로 다음 처리 범위를 계산하고 최대 24시간까지 복구하는 흐름
      caption: 시간별 배치의 마지막 성공 종료 구간을 Variable에 저장하고 다음 시작 구간으로 사용. 선행 배치 완료 범위와 최대 소급 범위를 함께 확인. 24시간은 처리 소요 시간이 아닌 자동 복구 대상 범위.
    - title: 전환 전후 데이터 비교 검증
      image: /projects/gs-retail-hbu/quality-check.svg
      alt: AS-IS와 TO-BE의 주요 컬럼 집계를 Diff Check DAG로 비교하는 흐름
      caption: 주요 컬럼별 건수·값을 같은 기준으로 비교하고 결과를 Redshift에 적재. 수행사와 고객사가 동일한 결과로 전환 정합성 확인.
    - title: Grafana 조회 부하와 운영 지표 개선
      image: /projects/gs-retail-hbu/monitoring.svg
      alt: Airflow 메타 DB 조회 쿼리 경량화와 Grafana 대시보드 지표 개선 관계
      caption: 기존 Grafana의 Airflow 메타 DB 조회 쿼리와 표시 지표 개선. 신규 모니터링 플랫폼 구축이 아닌 기존 운영 체계 개선 범위.
  results:
    - 1,000+ dbt 모델의 도메인별 실행 및 공통 호출 규칙 적용
    - 시간별 배치의 누락 구간 자동 복구 범위를 4시간에서 최대 24시간으로 확장
    - 선정한 고부하 모델을 분리해 상시 클러스터 증설 없이 자원 경합 완화
    - 공통 데이터 비교 검증과 배치 운영 지표 제공
  limits: 내부 식별자와 접속 정보는 제외한 논리 구성도. 전체 인프라·배포 체계 구축은 개인 담당 범위에 포함하지 않으며, 비용·처리 시간의 검증되지 않은 개선율은 표시하지 않음.
  takeaway: 업무별 실행 단위, 선행 완료 조건, 처리 구간과 검증 결과를 공통 규칙으로 정리해 여러 수행사와 운영팀이 같은 기준으로 개발·운영하도록 구성.

- id: next-kics
  type: platform
  label: 공공 데이터 · 수집 표준화
  question: 기관마다 다른 형식의 데이터를 어떻게 같은 적재 기준으로 다룰까?
  overview: 4개 사법기관의 이기종·비정형 데이터를 수집·적재하는 데이터 플랫폼 구축. 공통 지원 선임으로 ETL 개발 가이드와 데이터 표준, Python 법령정보 API 신규 연계 프로그램 담당.
  scope:
    - 기관별 데이터 형식과 BLOB 적재 오류에 대응하는 ETL 공통 개발 가이드·표준 수립
    - 메타데이터로 수집 대상을 판별하는 Python 법령정보 API 연계·전처리·적재 프로그램 개발
  architecture:
    title: 기관별 원천 형식을 공통 적재 기준으로 연결
    description: 기관별 원천 데이터의 형식 차이를 공통 ETL 가이드와 데이터 표준으로 정리하고 적재에 적용. 법령정보 API를 신규 연계하고 메타데이터 판단과 Python 전처리를 거쳐 분석 데이터로 적재.
    image: /projects/next-kics/data-standard.svg
    alt: 4개 기관 원천 데이터, ETL 공통 표준과 BLOB 적재의 관계
    caption: 본인 수행 범위의 논리 흐름을 재구성한 도식. 사법기관의 실제 망 구성·데이터 구조를 나타내는 인프라 구성도가 아님.
  figures: []
  results:
    - 기관별 형식 차이에 따른 BLOB 적재 오류 개선
    - 법령정보를 신규 분석 데이터로 확보하는 API 연계·전처리·적재 기반 마련
  limits: 전체 사법 시스템의 설계나 모든 기관의 파이프라인 개발을 단독 수행한 것으로 표현하지 않음. 처리량·오류율의 검증된 전후 수치는 없음.
  takeaway: 개별 오류를 수정하는 데서 끝내지 않고 공통 가이드와 데이터 기준으로 남겨야 반복되는 적재 문제를 줄일 수 있다는 점을 확인.

- id: local-finance
  type: platform
  label: 데이터 모델링 · 통계·BI
  question: 200여 개 화면을 화면별 물리 테이블 없이 어떻게 관리할까?
  overview: 행정안전부·전국 지자체 정책지원서비스의 통계·BI 화면 및 데이터 연계 구축. OLAP 개발 선임·Admin 역할로 공통 모델과 지표 산출, 외부 수집·연계 POC 수행.
