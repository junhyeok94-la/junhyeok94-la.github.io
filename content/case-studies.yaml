      url: https://www.yna.co.kr/view/AKR20230825131300530
      publisher: 연합뉴스
      date: '2023.08.27'
      description: 종합지역현황·데이터 기반 분석·지역상황 전망의 서비스 구성과 전 지자체 대상 개시 보도.
