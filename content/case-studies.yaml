    image: /projects/local-finance/data-model.svg
    alt: 통계청·한국은행 등 통계 데이터 수집과 지자체·주기 매핑, 공통 모델 및 화면 ID 기반 BI 조회 흐름
    caption: 본인 담당 범위를 재구성한 논리 흐름. 통계청·한국은행 API 연계와 내부 지표를 구분해 표현. 통계·BI 화면 원본은 보안상 생략.
