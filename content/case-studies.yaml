    description: 외부 통계 수집·정제 후 지자체·주기·화면 기준으로 매핑하고 화면용 공통 집계 구조를 사용. 화면별 조회는 화면 ID와 주기 조건으로 구분.
    image: /projects/local-finance/data-model.svg
    alt: 외부 통계 수집부터 차원 매핑, 공통 집계와 화면별 조회까지의 흐름
    caption: 본인 설명에 근거한 설계 개념도. 실제 DB의 물리적 키 구성이나 전체 스타 스키마를 단정하지 않으며, 모든 재정위기관리 화면이 외부 API로 구성된 것은 아님.
  figures: []
  results:
    - 200여 개 통계·BI 화면에 공통 테이블 모델과 개발 규칙 적용
    - 유형분류·재정위기관리 심화 화면 30여 본 구축
    - 통계청·한국은행 데이터의 초기 수집·적재 및 ETL 연계 기반 검증
  limits: 공통 집계 흐름은 개념 수준의 공개 설명. 비공개 원본 화면·실제 지자체 데이터는 게시하지 않으며, 화면 수는 본인 단독 개발 수와 구분.
  takeaway: 담당자의 업무 규칙을 산출 조건·데이터 기준·화면 동작으로 나눠 합의하는 과정이 모델 재사용과 검증의 출발점임을 확인.

- id: lgchem-data-lake
  type: platform
  label: 데이터 레이크 · 적재 전략
  question: 모든 테이블을 Full Load하지 않고 적재 방식을 어떻게 나눌까?
  overview: 전사 정형 데이터를 AWS 데이터 레이크로 이관하는 프로젝트. 원천 데이터 분석과 ODS 적재 방식 결정, Airflow DAG 코드 생성·적용이 본인 담당 범위.
  scope:
    - 원천 테이블의 볼륨·휘발성·예상 증가량·갱신 주기 프로파일링
    - ODS Full·Incremental 적재 방식과 대상·우선순위 결정
    - 결정한 적재 기준에 맞는 Airflow DAG 코드 생성·적용
  architecture:
    title: 원천 분석 결과를 적재 방식과 실행 코드로 연결
    description: 원천 테이블 특성을 분석해 Full·Incremental 방식을 결정하고 Airflow DAG로 실행에 적용. AWS S3·Glue·Athena는 프로젝트 환경이며 본인의 역할은 원천 분석과 적재 전략·DAG 적용 범위.
    image: /projects/lgchem-data-lake/loading-strategy.svg
    alt: 원천 프로파일링, Full·Incremental 적재 판단과 DAG 생성·적용 흐름
    caption: 본인 담당 업무를 재구성한 논리 흐름도. 전사 데이터 레이크 전체의 AWS 인프라 구성도가 아님.
  figures: []
  results:
    - 테이블 특성에 따른 Full·Incremental 적재 기준 수립
    - 적재 대상·우선순위와 실제 Airflow 실행 코드의 연결
  limits: Glue·Lake Formation의 주도 설계·운영 실적으로 확대하지 않음. 처리 시간·비용 절감률의 검증된 전후 수치는 없음.
  takeaway: 적재 도구를 정하기 전에 테이블의 변화 특성과 갱신 주기를 확인하고, 판단 기준을 실행 코드까지 연결하는 접근을 경험.

