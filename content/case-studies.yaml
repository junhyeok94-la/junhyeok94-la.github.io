- id: gs-retail-hbu
  type: platform
  label: 배치 최적화 · 플랫폼 전환
  question: Airflow·dbt 배치 실행 표준화와 누락 구간 복구
  overview: Oracle·SAS 기반 홈쇼핑 데이터를 AWS 데이터 플랫폼으로 전환. STG 수집·적재와 Mart·BI·IF 변환 배치를 구분해 운영하며, 배치 실행 제어·선택적 Serverless 실행·누락 구간 복구·비교 검증을 담당.
  scope:
    - 고객사 운영팀과 도메인별 실행 DAG 범위 합의, 태그·TaskGroup 공통 호출 규칙 정리
    - manifest.json의 의존성·태그를 분석하고, 선정한 고부하 모델의 run·test를 Serverless 태스크로 분리
    - Airflow Variable과 선행 배치 완료 구간을 기준으로 실행 범위를 계산하고, 최대 24시간 누락 구간 복구
    - 전환 전후 데이터를 비교하는 Diff Check DAG 개발 및 Grafana 조회 쿼리·운영 지표 개선
  architecture:
    title: HBU 데이터 플랫폼 전체 시스템 구성
    description: Airflow가 수집 API·EMR·dbt 실행을 제어. 수집 데이터를 S3에 적재하고 Redshift에서 변환하는 구성. Redshift Serverless는 선정한 고부하 모델 실행에 사용하며, Data Sharing으로 데이터를 연계. BI는 Redshift의 분석 데이터를 활용하고 Athena는 S3 데이터를 조회. Aurora·ECR·Lambda가 운영을 지원.
    image: /projects/gs-retail-hbu/system-architecture.svg
    alt: 원천 DB·로그, Fargate 수집 API, EMR, S3, Redshift·Serverless와 Data Sharing, BI·Athena 및 운영 지원 서비스를 포함한 HBU 전체 시스템 구성
    caption: 시스템 아키텍처 및 역할 정의 문서의 전체 구성을 바탕으로 재작성. 내부 시스템·스키마·접속 정보와 물리 망 구성은 생략. 실선은 데이터 연결, 점선은 배치 실행 제어를 표시하며 세부 수집 경로는 단순화.
  figures:
    - title: STG 수집·적재와 Mart·BI·IF 변환
      image: /projects/gs-retail-hbu/platform-overview.svg
      alt: 수집 API·EMR·S3·dbt Bash를 이용한 STG 적재와 Cosmos DbtTaskGroup을 이용한 후속 변환
      caption: STG는 수집 도구·EMR → S3 1차 적재 → dbt Bash → Redshift STG 2차 적재. 이후 Mart·BI·IF는 Cosmos DbtTaskGroup으로 모델 의존성에 따라 실행.
    - title: 도메인별 배치 실행 제어
      image: /projects/gs-retail-hbu/orchestration.svg
      alt: Control DAG가 선행 완료와 처리 구간을 확인하고 실행 DAG와 dbt TaskGroup을 호출하는 흐름
      caption: Mart·BI·IF 실행 구조. Control DAG가 선행 완료를 확인하고 처리 구간을 하위 DAG에 전달. Cosmos는 태그로 모델을 선택하고 모델 의존성에 따라 실행.
    - title: 개발 검증 후 운영 브랜치 병합·배포
      image: /projects/gs-retail-hbu/delivery-flow.svg
      alt: dev 브랜치를 Bamboo로 개발 배포하고 검증한 다음 prd로 병합해 운영 배포하는 순차 흐름
      caption: dev 배포·검증 → dev를 prd에 병합 → 운영 배포. 환경별 dbt와 DAG 코드는 구분해 배포. 배포 단계에서는 dbt parse로 manifest를 생성하고, 실제 데이터 처리는 Airflow 스케줄 실행 시 수행.
    - title: 고부하 모델의 선택적 실행 환경 분리
      image: /projects/gs-retail-hbu/workload-isolation.svg
      alt: 선정한 dbt 모델만 Serverless run·test 태스크로 전환하고 선행·후행 의존성을 연결하는 흐름
      caption: DbtTaskGroup의 모델별 실행 대상 변경을 보완하는 공통 함수 적용. 선정 모델의 run·test 태스크를 별도로 구성하고 기존 선행·후행 의존성 복원. 전체 모델의 Serverless 전환은 아님.
    - title: 마지막 성공 구간을 기준으로 누락 범위 복구
      image: /projects/gs-retail-hbu/interval-recovery.svg
      alt: 마지막 성공 종료 구간과 선행 완료 구간으로 다음 처리 범위를 계산하고 최대 24시간까지 복구하는 흐름
      caption: 시간별 배치의 마지막 성공 종료 구간을 Variable에 저장하고 다음 시작 구간으로 사용. 선행 배치 완료 범위와 최대 소급 범위를 함께 확인. 24시간은 처리 소요 시간이 아닌 자동 복구 대상 범위.
    - title: 전환 전후 데이터 비교 검증
      image: /projects/gs-retail-hbu/quality-check.svg
      alt: AS-IS와 TO-BE의 주요 컬럼 집계를 Diff Check DAG로 비교하는 흐름
      caption: 주요 컬럼별 건수·값을 같은 기준으로 비교하고 결과를 Redshift에 적재. 수행사와 고객사가 동일한 결과로 전환 정합성 확인.
    - title: Grafana 조회 부하와 운영 지표 개선
      image: /projects/gs-retail-hbu/monitoring.svg
      alt: Airflow 메타 DB 조회 쿼리 경량화와 Grafana 대시보드 지표 개선 관계
      caption: 기존 Grafana의 Airflow 메타 DB 조회 쿼리와 표시 지표 개선. 신규 모니터링 플랫폼 구축이 아닌 기존 운영 체계 개선 범위.
  results:
    - 1,000개 이상 dbt 모델의 도메인별 실행 및 공통 호출 규칙 적용
    - 시간별 배치의 누락 구간 자동 복구 범위를 4시간에서 최대 24시간으로 확장
    - 선정한 고부하 모델을 분리해 상시 클러스터 증설 없이 자원 경합 완화
    - 공통 데이터 비교 검증과 배치 운영 지표 제공
  limits: 공개용으로 재작성한 논리 구성도. 본인 담당 범위는 배치 실행·복구·검증·모니터링.
  takeaway: 업무별 실행 단위, 선행 완료 조건, 처리 구간과 검증 결과를 공통 규칙으로 정리해 여러 수행사와 운영팀이 같은 기준으로 개발·운영하도록 구성.

- id: next-kics
  type: platform
  label: 데이터플랫폼 · ETL · 대시보드 설계
  question: 기관별 데이터 수집·적재와 3개 기관 대시보드 화면 설계
  overview: 법무부·검찰청·경찰청·해양경찰청이 참여한 차세대 KICS 사업의 데이터플랫폼 구축 참여. LG CNS SBP 기반 Hadoop 환경에서 TeraStream 데이터 파이프라인과 공통 ETL 표준, Python 법령정보 API 연계 프로그램 담당. 검찰청·경찰청·해양경찰청의 대시보드는 화면 설계와 문서 작성 후 MSTR(MicroStrategy) 개발 담당자에게 인계.
  scope:
    - TeraStream을 사용한 데이터 파이프라인 개발, 기관별 형식 차이와 BLOB 적재 오류에 대응하는 공통 가이드·표준 수립
    - 메타데이터로 수집 대상을 판별하는 Python 법령정보 API 연계·전처리·적재 프로그램 개발
    - 법무부를 제외한 검찰청·경찰청·해양경찰청 대시보드 화면 설계 및 설계 문서 작성
    - 1차 설계 완료 후 설계 문서를 MSTR 개발 담당자에게 인계
  publicMaterialsTitle: 사업 개요와 사용 기술 참고 자료
  publicMaterialsNote: 정부 자료는 KICS 전체 사업을, 제품 자료는 SBP·TeraStream의 역할을 설명합니다. 아래 구성도는 본인 수행 경험을 바탕으로 재구성했습니다.
  publicMaterials:
    - title: 차세대 형사사법정보시스템 개통
      url: https://www.korea.kr/news/policyNewsView.do?newsId=148934088
      publisher: 대한민국 정책브리핑 · 관계기관 합동
      date: '2024.09.19'
      description: 4개 형사사법기관이 참여한 차세대 KICS의 개통과 전체 서비스 목표를 설명하는 정부 자료.
    - title: Hadoop 기반 스마트 빅데이터 플랫폼 SBP
      url: https://www.newswire.co.kr/newsRead.php?no=660742
      publisher: LG CNS 제공 보도자료 · 뉴스와이어
      date: '2012.10.31'
      description: Hadoop 기반 수집·저장·처리·분석 플랫폼의 기본 구성과 관리 기능을 소개하는 SBP 출시 자료.
    - title: 데이터 통합 솔루션 TeraStream
      url: https://datastreams.co.kr/products/data-integration-terastream/
      publisher: 데이터스트림즈
      date: 제품 소개
      description: 데이터 추출·매핑 룰 기반 변환·적재와 작업 이력 관리 등 ETL 솔루션의 역할을 설명하는 공식 자료.
  architecture:
    title: SBP 기반 Hadoop 데이터플랫폼과 데이터 파이프라인
    description: TeraStream으로 기관별 데이터를 추출·변환·적재하고, SBP 기반 Hadoop·Hive 환경에서 분석용 데이터 구성. 외부 법령정보는 Python API 연계·전처리로 확보. 대시보드는 설계 문서를 인계받은 MSTR 개발 담당자가 구현.
    image: /projects/next-kics/platform-architecture.svg
    alt: 기관별 원천과 TeraStream ETL, LG CNS SBP 기반 Hadoop·Hive 데이터플랫폼 및 대시보드 활용을 나타낸 논리 구성도
    caption: 본인 수행 경험과 공개 제품 설명을 바탕으로 정리한 도구별 역할도. 기관별 적용 흐름을 묶어 표현했으며, 실제 기관 간 데이터 공유·단일 클러스터·물리 망 연결을 의미하지 않음. 내부 테이블·데이터·접속 정보는 생략.
  figures:
    - title: 데이터플랫폼 사업 내 담당 영역
      image: /projects/next-kics/project-scope.svg
      alt: 데이터플랫폼 사업 아래 데이터플랫폼 구축과 지능형 사건처리지원 서비스를 구분하고 본인 담당 영역을 표시한 구성도
      caption: 현황분석서의 사업 범위를 역할 중심으로 재구성. 본인은 데이터플랫폼 구축 영역의 파이프라인·표준과 대시보드 설계 담당. 지능형 사건처리지원 서비스와 분석과제 발굴은 별도 수행 영역.
    - title: 3개 기관 대시보드 설계·개발 인계
      image: /projects/next-kics/dashboard-handoff.svg
      alt: 검찰청·경찰청·해양경찰청 대시보드의 화면 설계와 문서 작성 후 MSTR 개발 담당자에게 인계되는 흐름
      caption: 화면 설계 대상은 법무부를 제외한 3개 기관. 본인 산출물은 1차 화면 설계 문서이며, 실제 MSTR 화면 개발은 인계받은 담당자가 수행. 내부 설계서와 실제 화면은 공개하지 않음.
    - title: 기관별 데이터 형식과 공통 적재 기준
      image: /projects/next-kics/data-standard.svg
      alt: 기관별 원천 형식 차이를 ETL 공통 가이드와 데이터 표준으로 정리해 적재에 적용하는 흐름
      caption: 기관별 형식 차이와 BLOB 적재 오류에 대응한 공통 개발 가이드·데이터 표준 적용 범위.
  results:
    - 기관별 이기종 데이터에 적용할 ETL 공통 개발 가이드·표준 수립
    - BLOB 적재 오류 대응을 통한 데이터 파이프라인 안정성 개선
    - 법령정보 API 신규 연계·전처리·적재 프로그램 구현
    - 검찰청·경찰청·해양경찰청 대시보드 화면 설계 문서 작성 및 MSTR 개발 담당자 인계
  limits: 본인 담당 범위는 데이터플랫폼 구축과 화면 설계·문서 인계. MSTR 화면 구현은 별도 개발 담당자 수행.
  takeaway: 데이터 적재 기준과 화면 설계를 문서로 남겨 기관별 데이터 차이에 대응하고, 플랫폼 개발과 시각화 개발 담당자 사이의 인계를 지원.

- id: local-finance
  type: platform
  label: 정책지원시스템 · 통계·BI
  question: 정책지원 통계·BI 화면과 유사자치단체 유형관리 구축
  overview: 차세대 지방재정관리시스템(e호조+) 중 정책지원시스템 개발·구축 참여. OLAP 개발 선임·Admin으로 통계·BI 공통 모델과 개발 규칙, 통계청·한국은행 API 기반 통계 화면, 유형분류·재정위기관리 심화 화면 구현 담당.
  scope:
    - 공통 화면 ID 기반 통합 모델과 조회·개발 규칙을 200여 개 통계·BI 화면에 적용
    - 통계청·한국은행 API 데이터의 초기 수집·적재 스크립트, ETL 연계 POC 및 통계·BI 화면 개발
    - 유사자치단체 유형관리 11개 화면 개발 — 기준·지표 설정, 가중치 기반 산출, 차수별 저장, 확정·비교
    - 담당 공무원과 요구사항 조율, 유형분류·재정위기관리 심화 화면 30여 개 구축 및 유형분류 사용자지침서 작성
