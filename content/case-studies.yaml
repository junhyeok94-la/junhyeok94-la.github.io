    - 화면 ID를 조회·구분 기준으로 사용하는 One-Table 통합 모델과 개발 규칙 설계
    - 담당 공무원과 요구사항을 조율하고 내부 데이터·Open API 기반 지표 산출 구현
    - Python 초기 수집·적재 스크립트 및 ETL 연계 POC 수행
  architecture:
