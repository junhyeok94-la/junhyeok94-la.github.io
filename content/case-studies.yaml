  takeaway: 공무원의 업무 기준을 지표·가중치·차수·확정 상태와 조회 조건으로 구체화하고, 산출 결과를 전문기관 자료와 비교할 수 있도록 업무 흐름 구현.

- id: lgchem-data-lake
