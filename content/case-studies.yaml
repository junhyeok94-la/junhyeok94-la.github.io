  limits: 원본 코드·화면이 공개되지 않아 구체적인 스키마·API와 성능 지표를 추정하지 않음.
  takeaway: 현재 평가 처리뿐 아니라 이후의 이력 관리까지 업무 로직에 포함하는 개발 경험.
