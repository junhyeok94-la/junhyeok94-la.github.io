<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 675 405" role="img" aria-label="선정 모델을 기본 TaskGroup에서 제외한 뒤 Serverless 태스크를 추가하고 선후행 의존성을 유지"><style>text{font-family:"Noto Sans KR", "Malgun Gothic", sans-serif;fill:#1b2933;font-weight:550}.sub{fill:#637079;font-weight:420}.blue-text{fill:#264ce4;font-weight:650}</style><defs><marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637079"/></marker><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#264ce4"/></marker></defs><text x="4" y="18" font-size="12" class="blue-text" text-anchor="start">실행 대상 구성</text><rect x="4" y="32" width="168" height="62" rx="3" fill="#ffffff" stroke="#a9b2b7"/><text x="88.0" y="60.0" font-size="16" class="" text-anchor="middle">manifest · 태그</text><text x="88.0" y="82.0" font-size="11.5" class="sub" text-anchor="middle">모델 의존성 · 선택 범위</text><rect x="4" y="113" width="168" height="62" rx="3" fill="#ffffff" stroke="#a9b2b7"/><text x="88.0" y="141.0" font-size="16" class="" text-anchor="middle">Serverless 대상 설정</text><text x="88.0" y="163.0" font-size="11.5" class="sub" text-anchor="middle">선정한 모델을 명시</text><path d="M172 63H196V91H224" fill="none" stroke="#637079" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ga)"/><path d="M172 144H196V91H224" fill="none" stroke="#637079" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ga)"/><rect x="224" y="60" width="206" height="62" rx="3" fill="#e9edff" stroke="#a9b9f0"/><text x="327.0" y="88.0" font-size="16" class="blue-text" text-anchor="middle">기본 TaskGroup에서 제외</text><text x="327.0" y="110.0" font-size="11.5" class="sub" text-anchor="middle">대상 중복 실행 방지</text><path d="M430 91H465" fill="none" stroke="#637079" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ga)"/><rect x="465" y="60" width="203" height="62" rx="3" fill="#e9edff" stroke="#a9b9f0"/><text x="566.5" y="88.0" font-size="16" class="blue-text" text-anchor="middle">별도 태스크를 연결</text><text x="566.5" y="110.0" font-size="11.5" class="sub" text-anchor="middle">선후행 의존성 복원</text><text x="4" y="218" font-size="12" class="blue-text" text-anchor="start">실행 연결 예시</text><text x="665" y="218" font-size="11" class="sub" text-anchor="end">선정된 모델만 실행 환경 변경</text><rect x="0" y="235" width="668" height="164" rx="3" fill="#ecefef"/><text x="17" y="259" font-size="11" class="sub" text-anchor="start">AIRFLOW · 동일 실행 흐름</text><rect x="18" y="285" width="174" height="72" rx="3" fill="#ffffff" stroke="#a9b2b7"/><text x="105.0" y="318.0" font-size="16" class="" text-anchor="middle">선행 모델</text><text x="105.0" y="340.0" font-size="11.5" class="sub" text-anchor="middle">Provisioned</text><rect x="249" y="285" width="174" height="72" rx="3" fill="#e9edff" stroke="#a9b9f0"/><text x="336.0" y="318.0" font-size="16" class="blue-text" text-anchor="middle">선정 모델</text><text x="336.0" y="340.0" font-size="11.5" class="sub" text-anchor="middle">Serverless</text><rect x="480" y="285" width="174" height="72" rx="3" fill="#ffffff" stroke="#a9b2b7"/><text x="567.0" y="318.0" font-size="16" class="" text-anchor="middle">후행 모델</text><text x="567.0" y="340.0" font-size="11.5" class="sub" text-anchor="middle">Provisioned</text><path d="M192 321H249" fill="none" stroke="#637079" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ga)"/><path d="M423 321H480" fill="none" stroke="#637079" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ga)"/><text x="336" y="387" font-size="12" class="blue-text" text-anchor="middle">원래 모델의 선행·후행 연결을 유지</text></svg>