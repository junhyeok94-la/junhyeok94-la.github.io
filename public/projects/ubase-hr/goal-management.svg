<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" role="img" aria-label="2023년 매뉴얼에 제시된 목표 등록과 비율 입력, 전송 및 취소, 목표별 행동지표 작성 기능"><style>text{font-family:"Malgun Gothic",sans-serif;fill:#1b2933} .sub{fill:#526477} .title{font-weight:700;fill:#264ce4}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#637079"/></marker></defs><rect width="1020" height="300" fill="white"/><rect x="20" y="25" width="290" height="215" rx="6" fill="#f3f6fb" stroke="#b9c7da"/><text x="40" y="59" font-size="19" class="title">목표 등록·비율 입력</text><text x="40" y="90" font-size="16" class="sub">요소·대상 선택</text><text x="40" y="117" font-size="16" class="sub">목표 내용 등록</text><text x="40" y="144" font-size="16" class="sub">목표별 비율 입력</text><text x="40" y="171" font-size="16" class="sub">요소별 비율 합계 확인</text><rect x="365" y="25" width="290" height="215" rx="6" fill="#f3f6fb" stroke="#b9c7da"/><text x="385" y="59" font-size="19" class="title">목표 관리</text><text x="385" y="90" font-size="16" class="sub">직전 목표 가져오기</text><text x="385" y="117" font-size="16" class="sub">목표 전송</text><text x="385" y="144" font-size="16" class="sub">목표 전송 취소</text><rect x="710" y="25" width="290" height="215" rx="6" fill="#f3f6fb" stroke="#b9c7da"/><text x="730" y="59" font-size="19" class="title">목표별 행동지표</text><text x="730" y="90" font-size="16" class="sub">등록한 목표 선택</text><text x="730" y="117" font-size="16" class="sub">5단계 행동 기준 작성</text><text x="730" y="144" font-size="16" class="sub">저장 및 내용 수정</text><text x="20" y="280" font-size="15" class="sub">2023년 사용자 매뉴얼 참고 · 서비스 기능을 재구성한 도식 · 2021년 개인 구현 범위와 구분</text></svg>